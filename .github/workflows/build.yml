name: Xcode - Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build LiveContainer & SideStore (zh-CN)
    runs-on: xcode-27
    env:
      archive_path: archive
    steps:
      - name: Checkout LiveContainer-SideStore-zh_CN
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout SideStore (KSLengYu LiveContainerSupport)
        uses: actions/checkout@v6
        with:
          repository: KSLengYu/SideStore
          ref: LiveContainerSupport
          path: SideStore-src
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pre-populate SwiftPM binary artifacts
        run: |
          ARTIFACTS_DIR="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$ARTIFACTS_DIR"
          curl -fL "https://github.com/krzyzanowskim/OpenSSL/releases/download/3.6.2000/OpenSSL.xcframework.zip" \
            -o "$ARTIFACTS_DIR/https___github_com_krzyzanowskim_OpenSSL_releases_download_3_6_2000_OpenSSL_xcframework_zip"
          curl -fL "https://github.com/mahee96/unicorn/releases/download/2.1.4-multiarch/Unicorn.xcframework.zip" \
            -o "$ARTIFACTS_DIR/https___github_com_mahee96_unicorn_releases_download_2_1_4_multiarch_Unicorn_xcframework_zip"

      - name: Archive SideStore (zh-CN)
        run: |
          python3 SideStore-src/scripts/generate_full_strings.py
          cd SideStore-src
          xcodebuild archive \
            -archivePath "$GITHUB_WORKSPACE/SideStore-src/SideStore" \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=XYZ0123456 \
            ORG_IDENTIFIER=com.SideStore \
            -quiet

      - name: Archive LiveContainer
        run: |
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme LiveContainer \
            -project LiveContainer.xcodeproj \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Package IPAs
        run: bash .github/build_github.sh

      - name: Upload LiveContainer.ipa
        uses: actions/upload-artifact@v7
        with:
          name: LiveContainer.ipa
          path: LiveContainer.ipa

      - name: Upload LiveContainer+SideStore.ipa
        uses: actions/upload-artifact@v7
        with:
          name: LiveContainer+SideStore.ipa
          path: LiveContainer+SideStore.ipa

      - name: Upload SideStore-zh_CN.ipa
        uses: actions/upload-artifact@v7
        with:
          name: SideStore-zh_CN.ipa
          path: SideStore-zh_CN.ipa

  release__nightly:
    name: Nightly Release
    permissions:
      contents: write
    if: inputs.release__nightly || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    needs: [build]
    concurrency:
      group: release__nightly
      cancel-in-progress: true

    steps:
      - name: Download LiveContainer.ipa
        uses: actions/download-artifact@v8
        with:
          name: LiveContainer.ipa

      - name: Download LiveContainer+SideStore.ipa
        uses: actions/download-artifact@v8
        with:
          name: LiveContainer+SideStore.ipa

      - name: Download SideStore-zh_CN.ipa
        uses: actions/download-artifact@v8
        with:
          name: SideStore-zh_CN.ipa

      - name: Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            **Commit:** [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Message:** ${{ github.event.head_commit.message }}

            自动构建自 [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})（基于 LiveContainer + [KSLengYu/SideStore](https://github.com/KSLengYu/SideStore) 简体中文增强分支）。
          files: |
            LiveContainer+SideStore.ipa
            LiveContainer.ipa
            SideStore-zh_CN.ipa
